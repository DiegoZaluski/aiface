# Simple publish workflow for the `aiface` crate.
#
# Publishes to crates.io when a `v*` tag is pushed, or manually via
# workflow_dispatch. A version already present on crates.io is skipped
# (cargo publish would fail with "already exists"), so re-tagging is safe.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    # workflow_dispatch has no tag: skip the check entirely.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches the crate version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          crate_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$crate_version" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Cargo.toml has $crate_version but tag is $TAG_VERSION"
            exit 1
          fi

  publish:
    name: Test and publish to crates.io
    needs: [verify]
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Check the package builds as it would be published
        run: |
          cargo package --locked --allow-dirty
          cargo publish --locked --no-verify || {
            # "already exists" is a success: the tag was re-pushed or the
            # version was published by a previous run. Confirm against the
            # crates.io API for THIS version (not just "crate exists").
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: aiface-publish (github.com/DiegoZaluski/co-sh)' \
              "https://crates.io/api/v1/crates/aiface/$version" || true)"
            if [ "$code" = "200" ]; then
              echo "aiface $version already published, skipping"
            else
              exit 1
            fi
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
